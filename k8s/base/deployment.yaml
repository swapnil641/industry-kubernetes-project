apiVersion: apps/v1
kind: Deployment
metadata:
  name: industry-k8s-app
  labels:
    app: industry-k8s-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: industry-k8s-app
  template:
    metadata:
      labels:
        app: industry-k8s-app
    spec:
      containers:
        - name: industry-k8s-app
          image: industry-k8s-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: "development"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
