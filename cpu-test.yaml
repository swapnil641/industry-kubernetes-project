apiVersion: v1
kind: Pod
metadata:
  name: cpu-test
  namespace: rolling-test
spec:
  containers:
    - name: cpu-stress
      image: busybox:1.36
      command:
        - sh
        - -c
        - "while true; do :; done"
      resources:
        requests:
          cpu: 50m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi