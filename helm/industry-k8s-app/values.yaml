replicaCount: 2

image:
  repository: industry-k8s-app
  tag: v1
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: NodePort
  port: 8080

app:
  environment: development

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

# Kubernetes rolling update strategy
updateStrategy:
  maxSurge: 1
  maxUnavailable: 0