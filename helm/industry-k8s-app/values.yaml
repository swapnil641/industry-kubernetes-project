replicaCount: 2

image:
  repository: industry-k8s-app
  tag: v1
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: NodePort
  port: 8080

app:
  environment: development
  version: v2

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

# Kubernetes rolling update strategy
updateStrategy:
  maxSurge: 1
  maxUnavailable: 0


# Kubernetes health probes
probes:
  readiness:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3

  liveness:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 1
    failureThreshold: 3

  startup:
    enabled: true
    path: /health
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 30
