apiVersion: v1
kind: Pod
metadata:
  name: storage-test-pod
  namespace: rolling-test
spec:
  containers:
    - name: storage-container
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: app-storage-volume
          mountPath: /data
  volumes:
    - name: app-storage-volume
      persistentVolumeClaim:
        claimName: app-storage